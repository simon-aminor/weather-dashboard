<div
  class="relative flex w-full justify-center rounded-3xl bg-white/20 py-5 shadow-inner backdrop-blur transition-shadow dark:bg-night-800/30"
>
  <div class="relative z-30 flex w-full max-w-xl flex-col gap-2 px-3">
    <input
      #searchBox
      class="w-full rounded-2xl border border-day-300/70 bg-white/90 px-4 py-3 text-base text-day-800 placeholder:text-day-500 shadow-card-day backdrop-blur transition focus:border-day-500 focus:outline-none focus:ring-2 focus:ring-day-300 dark:border-night-600 dark:bg-night-800/90 dark:text-night-50 dark:placeholder:text-night-300 dark:shadow-card-night dark:focus:border-night-400 dark:focus:ring-night-400"
      type="text"
      placeholder="Search your city..."
      [ngModel]="searchTerm()"
    />

    <ul
      #dropDown
      class="absolute top-full z-50 mt-2 w-full max-h-0 overflow-y-auto rounded-2xl border border-day-200 bg-white/95 text-day-800 shadow-xl ring-1 ring-day-100/80 transition-all duration-200 ease-in-out dark:border-night-700 dark:bg-night-800/95 dark:text-night-50 dark:ring-night-700/60"
      [ngClass]="{
        'visible pointer-events-auto opacity-100 translate-y-0 max-h-[calc(7*2.75rem)] animate-slide-fade':
          showDropdown(),
        'invisible pointer-events-none opacity-0 translate-y-2 max-h-0 animate-slide-fade-reverse':
          !showDropdown()
      }"
    >
      @if (!filteredZones()?.length) {
      <li class="px-4 py-3 text-sm text-day-500 dark:text-night-300">
        No matches found. Try another city or spelling.
      </li>
      } @else { @for (zone of filteredZones(); track $index) {
      <li
        class="flex h-11 cursor-pointer items-center justify-between px-4 text-sm hover:bg-day-100 dark:hover:bg-night-700"
        (mousedown)="setSearchedValue(zone)"
      >
        <span class="font-medium">{{ zone.name }}</span>
        <span class="text-xs uppercase tracking-wide opacity-70">
          {{ zone.state ?? "" }} {{ zone.country }}
        </span>
      </li>
      } }
    </ul>
  </div>
</div>
