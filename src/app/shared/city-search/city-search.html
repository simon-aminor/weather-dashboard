<div
  class="w-full flex justify-center py-5 bg-gradient-to-b from-sky-100 to-blue-200 shadow-lg"
>
  <div class="relative w-[15vw] flex flex-col gap-2">
    <input
      #searchBox
      class="w-full bg-white focus:bg-sky-100 hover:bg-sky-200 text-sky-900 placeholder:text-sky-500 border border-sky-400 rounded-md p-3 text-lg shadow-sm"
      type="text"
      placeholder="Search Your City..."
      [ngModel]="searchTerm()"
    />

    <ul
      #dropDown
      class="absolute top-full mt-1 z-10 w-full max-h-0 overflow-y-auto bg-white text-sky-800 border border-sky-300 rounded-md shadow-md transition-all duration-200 ease-in-out"
      [ngClass]="{
        'visible pointer-events-auto opacity-100 translate-y-0 max-h-[calc(7*2.5rem)]':
          showDropdown(),
        'invisible pointer-events-none opacity-0 translate-y-2 max-h-0':
          !showDropdown()
      }"
    >
      @for (zone of filteredZones(); track $index) {
      <li
        class="p-2 h-10 hover:bg-sky-100 cursor-pointer"
        (click)="setSearchedValue(zone)"
      >
        {{ zone.city }}, {{ zone.country }}
      </li>
      }
    </ul>
  </div>
</div>
