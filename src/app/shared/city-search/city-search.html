<div class="w-full flex justify-center">
  <input
    class="bg-blue-200 rounded-sm"
    type="text"
    placeholder="Search Your City..."
    [ngModel]="searchTerm"
    onchange="searchCity($event)"
  />
  @if (dropDownShow()) {
  <ul>
    @for (city of cityList(); track $index) {
    <li>{{ city.name }},{{ city.country }}</li>
    }
  </ul>
  }
</div>
