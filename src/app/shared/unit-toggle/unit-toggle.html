<div class="flex items-center justify-center">
  <div
    class="flex w-full max-w-[420px] flex-wrap justify-center gap-1 rounded-full bg-white/70 p-1 shadow-card-day backdrop-blur dark:bg-night-800/70 dark:shadow-card-night"
  >
    @for (option of unitOptions(); track option.value) {
      <button
        type="button"
        class="group flex w-24 flex-col items-center rounded-full px-4 py-2 text-sm font-semibold text-day-700 transition hover:bg-day-200/70 focus:outline-none focus-visible:ring-2 focus-visible:ring-aurora-300 dark:text-night-100 dark:hover:bg-night-700/70 sm:w-32"
        [ngClass]="{
          'bg-day-500 text-white shadow-card-day hover:bg-day-500 dark:bg-night-500 dark:text-white dark:shadow-card-night dark:hover:bg-night-500': isActive(option)
        }"
        (click)="selectUnit(option.value)"
        [attr.aria-pressed]="isActive(option)"
        [title]="option.label + ' • wind: ' + option.windHint"
      >
        <span class="text-2xl font-bold sm:hidden">
          {{ option.short }}
        </span>
        <span class="hidden text-base font-semibold leading-none sm:block">
          {{ option.symbol }}
        </span>
        <span class="mt-1 text-[0.65rem] uppercase tracking-[0.25em] opacity-70 sm:hidden">
          {{ option.symbol }}
        </span>
        <span class="hidden text-[0.65rem] uppercase tracking-[0.25em] opacity-70 sm:block">
          {{ option.label }}
        </span>
      </button>
    }
  </div>
</div>
