<div class="flex items-center justify-center">
  <div class="flex gap-1 rounded-full bg-white/70 p-1 shadow-md">
    @for (unit of units(); track unit) {
      <button
        type="button"
        class="rounded-full px-4 py-2 text-sm font-medium transition"
        [ngClass]="{
          'bg-sky-500 text-white shadow': isActive(unit),
          'text-sky-600 hover:bg-sky-100': !isActive(unit)
        }"
        (click)="selectUnit(unit)"
      >
        {{ labelFor(unit) }}
      </button>
    }
  </div>
</div>
